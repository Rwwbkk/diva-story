<style>
:root{--burg:#6B1A2E;--velvet:#3B0E1B;--gold:#C8A676;--ivory:#F7F0EA;--paper:#FFFCF9;--ink:#24161A;--taupe:#7A6668;--line:#DCCBBF;--linen:#EADDD3;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--ivory)}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:Jost,'Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:1000px;margin:0 auto;padding-top:max(clamp(28px,6vw,72px),env(safe-area-inset-top,0px));padding-bottom:max(72px,env(safe-area-inset-bottom,0px));padding-left:max(clamp(18px,5vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(18px,5vw,48px),env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:clamp(28px,6vw,80px);align-items:start}
.head{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.head svg{width:132px;display:block;color:var(--burg);--logo-accent:var(--gold)}
.head h1{margin:0;font:400 clamp(26px,3.4vw,34px)/1.1 'Bodoni Moda',Georgia,serif;color:var(--burg)}
.head .ar{font-family:Amiri,serif;font-weight:700;direction:rtl;font-size:22px;color:var(--taupe)}
.preview{position:sticky;top:24px}
.preview img{display:block;width:100%;height:auto;aspect-ratio:9/16;border-radius:18px;box-shadow:0 26px 40px -26px rgba(36,22,26,.55),0 2px 6px rgba(36,22,26,.12);background:var(--linen)}
.controls{display:flex;flex-direction:column;gap:30px;padding-top:4px}
.field{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--taupe);font-weight:500}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:1px dashed rgba(107,26,46,.4);background:var(--paper);text-align:center;padding:22px;cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:#fff;border-color:var(--burg)}
.drop b{font:400 22px/1.2 'Bodoni Moda',Georgia,serif;color:var(--burg)}
.drop span{font-size:14px;color:var(--taupe)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop:focus-within{outline:2px solid var(--burg);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input[type=number]{width:110px;font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0}
input[type=number]:focus{outline:2px solid var(--burg);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--paper)}
.seg label{position:relative;display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:15px}
.seg label+label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0}
.seg i{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.seg label:has(input:checked){background:var(--burg);color:var(--ivory)}
.seg label:has(input:checked) i{box-shadow:0 0 0 1.5px var(--gold)}
.seg label:has(input:focus-visible){outline:2px solid var(--burg);outline-offset:2px}
.trim{display:grid;grid-template-columns:110px 1fr 46px;gap:8px 14px;align-items:center;font-size:15px}
.trim output{font-variant-numeric:tabular-nums;color:var(--taupe);text-align:right}
input[type=range]{width:100%;accent-color:var(--burg)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.save{font:inherit;font-weight:500;font-size:15px;letter-spacing:.16em;text-transform:uppercase;padding:16px 28px;border:0;background:var(--burg);color:var(--ivory);cursor:pointer;-webkit-appearance:none;border-radius:0}
.save:hover{background:var(--velvet)}
.save.ghost{background:transparent;color:var(--burg);box-shadow:inset 0 0 0 1px var(--burg)}
.save.ghost:hover{background:var(--paper)}
.save:disabled{opacity:.55;cursor:default}
.save:focus-visible{outline:2px solid var(--burg);outline-offset:3px}
.note{font-size:14px;color:var(--taupe);max-width:46ch}
.status{min-height:1.4em;font-size:14px;color:var(--burg)}
canvas{display:none}
body.render{background:#000}
body.render .app{display:none}
body.render canvas{display:block;width:1080px;height:1920px}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .preview{position:static;max-width:250px;width:100%;margin:0 auto}
  .head svg{width:110px}
}
</style>

<main class="app">
  <header class="head">
    <div><svg viewBox="0 0 600 288.81" role="img" aria-label="Diva Boutique"><use href="#logo-primary"/></svg></div>
    <div><h1>Reviews story</h1><span class="ar" lang="ar">آراء عميلاتنا</span></div>
  </header>

  <div class="preview"><img id="out" alt="The finished story" width="1080" height="1920"></div>

  <div class="controls">
    <div class="field">
      <span class="lbl">Her message</span>
      <label class="drop" id="drop"><input type="file" id="file" accept="image/*"><b>Add the screenshot</b><span>Choose it from your photos, or drop or paste it here</span></label>
    </div>
    <div class="field">
      <span class="lbl">Trim the screenshot</span>
      <div class="trim">
        <label for="tt">From the top</label><input type="range" id="tt" min="0" max="45" value="0"><output id="tto">0%</output>
        <label for="tb">From the bottom</label><input type="range" id="tb" min="0" max="45" value="0"><output id="tbo">0%</output>
      </div>
    </div>
    <div class="row" style="gap:36px;align-items:flex-start">
      <div class="field"><label class="lbl" for="num">Number</label><input type="number" id="num" min="1" max="999" value="1"></div>
      <div class="field"><span class="lbl">Colour</span>
        <div class="seg" role="radiogroup" aria-label="Colour">
          <label><input type="radio" name="theme" value="burgundy" checked><i style="background:var(--burg)"></i>Burgundy</label>
          <label><input type="radio" name="theme" value="ivory"><i style="background:var(--ivory)"></i>Ivory</label>
        </div></div>
    </div>
    <div class="field">
      <div class="btns"><button class="save" id="share" type="button" hidden>Save or share</button><button class="save" id="save" type="button">Download</button></div>
      <span class="status" id="status" role="status"></span>
      <p class="note">1080 × 1920 PNG. On iPhone, tap Save or share, then Save Image, or send it straight to Instagram. Leave the number empty to hide it.</p>
    </div>
  </div>

<canvas id="cv" width="1080" height="1920"></canvas>

<script>
(() => {
const W = 1080, H = 1920;
const C = {burg:'#6B1A2E', velvet:'#3B0E1B', gold:'#C8A676', ivory:'#F7F0EA', paper:'#FFFCF9', ink:'#24161A', taupe:'#7A6668', line:'#DCCBBF', linen:'#EADDD3'};
const THEMES = {
  burgundy: {bg:['#80283C', '#5E1628', '#3A0D1A'], card:C.ivory, ink:C.burg, sub:C.taupe, lines:C.gold, logo:C.ivory, acc:C.gold,
             cardShadow:'rgba(18,3,8,.5)', shotShadow:'rgba(36,22,26,.20)', edge:'rgba(122,102,104,.28)', seal:C.velvet},
  ivory:    {bg:['#FFFDFB', '#F7F0EA', '#E9DCD1'], card:C.burg, ink:C.ivory, sub:C.gold, lines:C.gold, logo:C.burg, acc:C.gold,
             cardShadow:'rgba(59,14,27,.32)', shotShadow:'rgba(10,2,5,.40)', edge:'rgba(200,166,118,.45)', seal:C.velvet},
};

/* ---- the logo sprite, drawn as paths ---- */
const SYM = {};
document.querySelectorAll('symbol').forEach(s => {
  const vb = s.getAttribute('viewBox').split(/[\s,]+/).map(Number);
  const els = [];
  s.querySelectorAll('path,rect').forEach(e => {
    let d = e.getAttribute('d');
    if (e.tagName === 'rect') { const x = +e.getAttribute('x'), y = +e.getAttribute('y'), w = +e.getAttribute('width'), h = +e.getAttribute('height'); d = `M${x} ${y}h${w}v${h}h${-w}Z`; }
    const st = e.getAttribute('style') || '', fill = e.getAttribute('fill');
    const role = /logo-accent/.test(st) ? 'acc' : 'fg';
    const stroke = /stroke:/.test(st) ? +(e.getAttribute('stroke-width') || 1) : 0;
    const tr = e.getAttribute('transform') || '';
    const t = /translate\(([-\d.]+)[ ,]+([-\d.]+)\)/.exec(tr), sc = /scale\(([-\d.]+)\)/.exec(tr);
    els.push({p: new Path2D(d), role, stroke, fill: stroke ? null : (fill === 'none' ? null : role), tx: t ? +t[1] : 0, ty: t ? +t[2] : 0, s: sc ? +sc[1] : 1});
  });
  SYM[s.id] = {w: vb[2], h: vb[3], els};
});
function drawSym(ctx, id, x, y, w, fg, acc) {
  const S = SYM[id], k = w / S.w;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  for (const e of S.els) {
    ctx.save(); ctx.translate(e.tx, e.ty); ctx.scale(e.s, e.s);
    const col = e.role === 'acc' ? acc : fg;
    if (e.stroke) { ctx.strokeStyle = col; ctx.lineWidth = e.stroke; ctx.stroke(e.p); } else { ctx.fillStyle = col; ctx.fill(e.p); }
    ctx.restore();
  }
  ctx.restore();
  return w * S.h / S.w;
}

/* ---- shapes ---- */
if (!Path2D.prototype.roundRect) {
  Path2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
function arch(x, y, w, h, ry) {
  const p = new Path2D(), rx = w / 2;
  p.moveTo(x, y + h); p.lineTo(x, y + ry);
  p.ellipse(x + rx, y + ry, rx, ry, 0, Math.PI, 2 * Math.PI);
  p.lineTo(x + w, y + h); p.closePath();
  return p;
}
function rrect(x, y, w, h, r) { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; }

/* a quiet stand-in chat, used until a screenshot is added */
function placeholder(ctx, x, y, w, h) {
  ctx.save(); ctx.clip(rrect(x, y, w, h, 26));
  ctx.fillStyle = '#EFE6DF'; ctx.fillRect(x, y, w, h);
  const bub = (bx, by, bw, lines, mine) => {
    const bh = 34 + lines * 30;
    ctx.fillStyle = mine ? '#E2CFC5' : '#FFFCF9';
    ctx.fill(rrect(mine ? x + w - 36 - bw : x + 36, by, bw, bh, 22));
    ctx.fillStyle = 'rgba(36,22,26,.13)';
    for (let i = 0; i < lines; i++) {
      const lw = (i === lines - 1 ? 0.55 : 0.86) * (bw - 56);
      const lx = mine ? x + w - 36 - 28 - lw : x + 36 + bw - 28 - lw;
      ctx.fill(rrect(lx, by + 26 + i * 30, lw, 12, 6));
    }
    return by + bh;
  };
  let yy = y + 40;
  yy = bub(0, yy, w * 0.62, 2, true) + 26;
  yy = bub(0, yy, w * 0.74, 3, false) + 26;
  bub(0, yy, w * 0.40, 1, false);
  ctx.restore();
}

/* ---- the story ---- */
function render(ctx, o) {
  const T = THEMES[o.theme] || THEMES.burgundy;
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * 0.36, 40, W / 2, H * 0.42, H * 0.82);
  g.addColorStop(0, T.bg[0]); g.addColorStop(0.55, T.bg[1]); g.addColorStop(1, T.bg[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // the screenshot area
  const maxW = 800, maxH = 780;
  let aspect = 0.68, sx = 0, sy = 0, sw = 0, sh = 0;
  if (o.img) {
    sw = o.img.naturalWidth; sy = Math.round(o.img.naturalHeight * o.trimTop / 100);
    sh = Math.max(20, Math.round(o.img.naturalHeight * (1 - (o.trimTop + o.trimBottom) / 100)));
    aspect = sh / sw;
  }
  let shotW = Math.min(maxW, maxH / aspect), shotH = shotW * aspect;

  // vertical rhythm
  const logoW = 280, logoH = logoW * SYM['logo-primary'].h / SYM['logo-primary'].w;
  const cardW = 940, cardX = (W - cardW) / 2, ry = 230;
  const headH = 318, footH = 124, sealR = 70;
  const cardH = headH + shotH + footH;
  const groupH = logoH + 78 + cardH + sealR;
  const safeTop = 210, safeBot = 1700;
  const top = Math.round(safeTop + Math.max(0, (safeBot - safeTop - groupH) / 2));
  const cardY = top + logoH + 78;

  drawSym(ctx, 'logo-primary', (W - logoW) / 2, top, logoW, T.logo, T.acc);

  // card
  const card = arch(cardX, cardY, cardW, cardH, ry);
  ctx.save(); ctx.shadowColor = T.cardShadow; ctx.shadowBlur = 70; ctx.shadowOffsetY = 30;
  ctx.fillStyle = T.card; ctx.fill(card); ctx.restore();
  ctx.strokeStyle = T.lines;
  ctx.lineWidth = 2;   ctx.stroke(arch(cardX + 22, cardY + 22, cardW - 44, cardH - 44, ry - 22));
  ctx.lineWidth = 1.2; ctx.stroke(arch(cardX + 33, cardY + 33, cardW - 66, cardH - 66, ry - 33));

  // heading
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (o.num) {
    ctx.fillStyle = T.ink; ctx.font = 'italic 400 34px "Bodoni Moda"';
    ctx.fillText('N° ' + String(o.num).padStart(2, '0'), W / 2, cardY + 122);
  }
  ctx.direction = 'rtl'; ctx.fillStyle = T.ink; ctx.font = '700 80px Amiri';
  ctx.fillText('آراء عميلاتنا', W / 2, cardY + 222);
  ctx.direction = 'ltr'; ctx.fillStyle = T.sub; ctx.font = 'italic 400 32px "Bodoni Moda"';
  ctx.fillText('In her words', W / 2, cardY + 272);

  // screenshot
  const shX = (W - shotW) / 2, shY = cardY + headH;
  const frame = rrect(shX, shY, shotW, shotH, 26);
  ctx.save(); ctx.shadowColor = T.shotShadow; ctx.shadowBlur = 36; ctx.shadowOffsetY = 14;
  ctx.fillStyle = '#EFE6DF'; ctx.fill(frame); ctx.restore();
  if (o.img) { ctx.save(); ctx.clip(frame); ctx.drawImage(o.img, sx, sy, sw, sh, shX, shY, shotW, shotH); ctx.restore(); }
  else placeholder(ctx, shX, shY, shotW, shotH);
  ctx.strokeStyle = T.edge; ctx.lineWidth = 1.5; ctx.stroke(frame);

  // the seal, half on the card
  const cx = W / 2, cy = cardY + cardH;
  ctx.save(); ctx.shadowColor = 'rgba(18,3,8,.35)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.beginPath(); ctx.arc(cx, cy, sealR, 0, Math.PI * 2); ctx.fillStyle = T.seal; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, sealR - 7, 0, Math.PI * 2); ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke();
  const mode = o.seal || 'd';
  if (mode === 'woman') { const w = 44, h = w * SYM['glyph-woman'].h / SYM['glyph-woman'].w; drawSym(ctx, 'glyph-woman', cx - w / 2 - 2, cy - h / 2, w, C.gold, C.gold); }
  else if (mode === 'd') { const w = 84, h = w * SYM['glyph-d'].h / SYM['glyph-d'].w; drawSym(ctx, 'glyph-d', cx - w / 2 + 4, cy - h / 2 - 2, w, C.gold, C.gold); }
  else { const w = 62, h = w * 4 / 3; drawSym(ctx, 'logo-monogram', cx - w / 2, cy - h / 2 - 2, w, C.gold, C.gold); }
}

/* ---- page ---- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const q = new URLSearchParams(location.search);
const state = {theme: 'burgundy', num: 1, trimTop: 0, trimBottom: 0, img: null, seal: q.get('seal') || 'd'};
const fontsReady = Promise.all(['700 80px Amiri', 'italic 400 34px "Bodoni Moda"'].map(f => document.fonts.load(f, 'آراء N°'))).catch(() => {});

if (q.has('render')) {
  document.body.classList.add('render');
  state.theme = q.get('render');
  state.num = q.has('n') ? +q.get('n') || 0 : 1;
  state.trimTop = +(q.get('tt') || 0); state.trimBottom = +(q.get('tb') || 0);
  const go = () => fontsReady.then(() => render(ctx, state));
  if (q.get('shot')) { const im = new Image(); im.onload = () => { state.img = im; go(); }; im.src = q.get('shot'); } else go();
  return;
}

const out = document.getElementById('out'), status = document.getElementById('status');
const shareBtn = document.getElementById('share'), saveBtn = document.getElementById('save');
let pending = 0, ready = null, readyUrl = '', job = 0;
const fileName = () => 'diva-review' + (state.num ? '-' + String(state.num).padStart(2, '0') : '') + '.png';
function update() {
  cancelAnimationFrame(pending);
  shareBtn.disabled = saveBtn.disabled = true;
  pending = requestAnimationFrame(() => {
    render(ctx, state);
    const my = ++job;
    cv.toBlob(blob => {
      if (my !== job || !blob) return;
      ready = new File([blob], fileName(), {type: 'image/png'});
      if (readyUrl) URL.revokeObjectURL(readyUrl);
      readyUrl = URL.createObjectURL(blob);
      out.src = readyUrl;
      shareBtn.disabled = saveBtn.disabled = false;
    }, 'image/png');
  });
}
try {
  const probe = new File([new Blob(['x'], {type: 'image/png'})], 'p.png', {type: 'image/png'});
  if (navigator.canShare && navigator.canShare({files: [probe]})) { shareBtn.hidden = false; saveBtn.classList.add('ghost'); }
} catch (e) {}
function setImage(file) {
  if (!file || !/^image\//.test(file.type)) { status.textContent = 'That file is not a picture.'; return; }
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => { state.img = im; status.textContent = ''; update(); };
  im.onerror = () => { status.textContent = 'That picture could not be opened.'; };
  im.src = url;
}
const drop = document.getElementById('drop'), file = document.getElementById('file');
file.addEventListener('change', () => setImage(file.files[0]));
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setImage(e.dataTransfer.files[0]));
document.addEventListener('paste', e => { const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/')); if (it) setImage(it.getAsFile()); });
for (const [id, key] of [['tt', 'trimTop'], ['tb', 'trimBottom']]) {
  const r = document.getElementById(id), o = document.getElementById(id + 'o');
  r.addEventListener('input', () => { state[key] = +r.value; o.textContent = r.value + '%'; update(); });
}
const num = document.getElementById('num');
num.addEventListener('input', () => { state.num = Math.max(0, Math.min(999, Math.floor(+num.value) || 0)); update(); });
document.querySelectorAll('input[name=theme]').forEach(r => r.addEventListener('change', () => { state.theme = r.value; update(); }));

shareBtn.addEventListener('click', () => {
  if (!ready) return;
  navigator.share({files: [ready]}).then(() => { status.textContent = ''; }).catch(err => {
    if (err && err.name === 'AbortError') return;
    status.textContent = 'Sharing did not open. Press and hold the picture to save it.';
  });
});
saveBtn.addEventListener('click', () => {
  if (!ready) return;
  const a = document.createElement('a'); a.href = readyUrl; a.download = ready.name;
  document.body.appendChild(a); a.click(); a.remove();
});
fontsReady.then(update);
document.fonts.addEventListener?.('loadingdone', update);
})();
</script>
